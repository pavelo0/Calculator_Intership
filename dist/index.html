<!doctype html><html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Simple Calculator</title><script defer="defer" src="bundle.js"></script></head><body><div class="calc" id="calculator"><div class="top"><div class="decorations"><button class="theme-toggle" id="themeToggle" title="Сменить тему">Theme</button></div><input class="input" value="0" readonly="readonly"/></div><div class="buttons"><button class="ac" data-button-type="clear_all" title="Очистить">AC</button> <button data-button-type="percent" value="%">%</button> <button data-button-type="toggle_sign" value="sign">+/−</button> <button data-button-type="operator" value="div">÷</button> <button data-button-type="operand" value="7">7</button> <button data-button-type="operand" value="8">8</button> <button data-button-type="operand" value="9">9</button> <button data-button-type="operator" value="mul">×</button> <button data-button-type="operand" value="4">4</button> <button data-button-type="operand" value="5">5</button> <button data-button-type="operand" value="6">6</button> <button data-button-type="operator" value="dif">−</button> <button data-button-type="operand" value="1">1</button> <button data-button-type="operand" value="2">2</button> <button data-button-type="operand" value="3">3</button> <button data-button-type="operator" value="sum">+</button> <button class="zero" data-button-type="operand" value="0">0</button> <button data-button-type="decimal_separator" value=".">.</button> <button data-button-type="equal" value="=">=</button></div></div></body></html>
